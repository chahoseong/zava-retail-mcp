[project]
name = "zava-retail-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "asyncpg==0.32.0",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.uv]
required-version = "==0.13.6"

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["zava_mcp_server/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["zava_mcp_server"]
strict = true
plugins = ["pydantic.mypy"]
